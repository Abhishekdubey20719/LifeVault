{% extends 'base.html' %}
{% load static %}

{% block title %}Login - LifeVault{% endblock %}

{% block content %}

<div class="container">

    <div class="row justify-content-center align-items-center" style="min-height:100vh;">

        <div class="col-lg-5">

            <div class="login-card">

                <h2 class="text-center mb-2">LifeVault</h2>

                <p class="text-center text-muted mb-4">
                    Welcome Back 👋
                </p>

                <form method="POST">

                    {% csrf_token %}

                    <div class="mb-3">

                        <label>Username</label>

                        <input type="text"
                               name="username"
                               class="form-control"
                               required>

                    </div>

                    <div class="mb-4">

                        <label>Password</label>

                        <input type="password"
                               name="password"
                               class="form-control"
                               required>

                    </div>

                    <button class="btn btn-primary w-100">

                        Login

                    </button>

                </form>

                <p class="text-center mt-4">

                    Don't have an account?

                    <a href="{% url 'register' %}">

                        Register

                    </a>

                </p>

            </div>

        </div>

    </div>

</div>

{% endblock %}
