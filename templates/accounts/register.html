{% extends 'base.html' %}

{% block title %}Register{% endblock %}

{% block content %}

<div class="container">

<div class="row justify-content-center align-items-center" style="min-height:100vh;">

<div class="col-lg-5">

<div class="login-card">

<h2 class="text-center">Create Account</h2>

<form method="POST">

{% csrf_token %}

<div class="mb-3">

<label>Username</label>

<input
type="text"
name="username"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Email</label>

<input
type="email"
name="email"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Password</label>

<input
type="password"
name="password"
class="form-control"
required>

</div>

<div class="mb-4">

<label>Confirm Password</label>

<input
type="password"
name="confirm_password"
class="form-control"
required>

</div>

<button class="btn btn-primary w-100">

Create Account

</button>

</form>

<p class="text-center mt-4">

Already have an account?

<a href="{% url 'login' %}">

Login

</a>

</p>

</div>

</div>

</div>

</div>

{% endblock %}
