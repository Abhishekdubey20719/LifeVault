{% extends 'base.html' %}

{% block title %}
Change Password | LifeVault
{% endblock %}

{% block content %}

{% include 'includes/app_navbar.html' %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-6">

            <div class="card shadow border-0 rounded-4">

                <div class="card-body p-4">

                    <h2 class="fw-bold mb-4">

                        <i class="bi bi-key-fill"></i>

                        Change Password

                    </h2>

                    <form method="POST">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label class="form-label">

                                Current Password

                            </label>

                            {{ form.old_password }}

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                New Password

                            </label>

                            {{ form.new_password1 }}

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Confirm Password

                            </label>

                            {{ form.new_password2 }}

                        </div>

                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-primary">

                                <i class="bi bi-check-circle"></i>

                                Update Password

                            </button>

                            <a href="{% url 'profile' %}"
                               class="btn btn-secondary">

                                Cancel

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
